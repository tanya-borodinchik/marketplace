<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div class="button-container">

            <div id="search">
                <input type="text" id="searchInput" placeholder="Поиск">
            </div>

            <div id="filterSelect" class="custom-select">
                <div id="filterSelected" class="selected" data-value="all">Все категории</div>
                <ul id="filterOptions" class="options"></ul>
            </div>

            <button id="sortPrice">Сортировать по цене</button>
            <button class="cardAddButton">Добавить</button>
        </div>

        <dialog class="modal" id="addCardDialog" role="dialog">
            <header class="modal-header">
                <h1>Добавить товар</h1>
            </header>
            <main class="modal-main">

                <input type="text" id="title" placeholder="Название товара">
                <input type="text" id="description" placeholder="Описание товара">
                <input type="number" id="price" placeholder="Цена товара" min="1">

                <div id="category" class="custom-select">
                    <div id="selected"></div>
                    <ul id="options" class="options"></ul>
                </div>

                <footer class="modal-footer">
                    <button id="addButton">Добавить</button>
                    <button id="closeButton">Отменить</button>
                </footer>
        </dialog>

        <div class="cards-container"></div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
